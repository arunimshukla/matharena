[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "harness-wrapper"
version = "0.1.0"
description = "A CLI-agnostic wrapper for coding-agent harnesses"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SRI" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = ["loguru>=0.7.3,<1", "websockets>=15,<16"]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[project.scripts]
harness-wrapper = "harness_wrapper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_wrapper"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: starts real external processes or services",
  "gpu: requires a cooperatively booked CUDA GPU",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["claude-agent-sdk-python-main"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
