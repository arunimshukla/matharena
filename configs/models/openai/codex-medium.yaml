human_readable_id: GPT-5.6-Sol (medium, via Codex subscription)
date: "2026-07-09"
other_params:
  analysis_id: openai/gpt-56-sol-codex-medium
  open: false
  creator: OpenAI

# Uses the host's saved Codex/ChatGPT login; no OPENAI_API_KEY is required.
harness: codex
harness_version: "0.147.0"
model: gpt-5.6-sol
api: openai
reasoning_effort: medium
read_cost: 5
cache_read_cost: 0.5
write_cost: 30
concurrent_requests: 16

harness_config:
  auth: subscription
  oauth_auto_login: false
  oauth_auto_relogin: false
  container_executable: codex
  cpu_limit: 4
  memory_gb: 12
  pids_limit: 768
  tmpfs_size: 1g
  read_only_rootfs: true
  workspace_root: logs/harness_workspaces/{competition}/{solver_name}/p{problem_idx}_r{run_idx}
  keep_workspaces: true
